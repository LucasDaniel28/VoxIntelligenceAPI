spring:
  application:
    name: vox-intelligence-api
  ai:
    openai:
      # Key temporária para testes: configure OPENAI_API_KEY no ambiente local.
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
      audio:
        transcription:
          model: whisper-1
          language: pt
          response-format: text

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vox}
    username: ${DB_USERNAME:vox}
    password: ${DB_PASSWORD:vox}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: 8080

app:
  time-zone: America/Sao_Paulo
